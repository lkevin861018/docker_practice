name: CI - Flask tests, integration, Trivy and GHCR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-scan-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate ephemeral CI configuration
        run: bash ci/scripts/make-ci-env.sh

      - name: Validate Docker Compose
        run: docker compose --env-file .env.ci config --quiet

      - name: Build Flask image once
        run: docker compose --env-file .env.ci build app

      - name: Run Flask unit tests in built image
        run: |
          docker compose --env-file .env.ci run --rm --no-deps \
            -v "${PWD}/app/tests:/app/tests:ro" \
            --entrypoint python app \
            -m unittest discover -s /app/tests -v

      - name: Start isolated PostgreSQL and initialize roles
        run: |
          docker compose --env-file .env.ci up -d --wait db
          docker compose --env-file .env.ci run --build --rm db-setup

      - name: Run Flask + Nginx integration test
        run: |
          docker compose --env-file .env.ci up -d --wait app nginx
          python3 ci/scripts/test-http.py

      - name: Export image to an archive for socketless Trivy scanning
        run: |
          mkdir -p ci-artifacts
          docker save -o ci-artifacts/flask-image.tar flask-nginx-postgres-lab-app:v6

      - name: Trivy gate - fail for HIGH or CRITICAL CVEs
        run: |
          docker run --rm \
            -v "${PWD}/ci-artifacts:/scan" \
            aquasec/trivy:0.76.1 image \
            --input /scan/flask-image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --output /scan/trivy-vulnerabilities.json \
            --exit-code 1

      - name: Generate CycloneDX SBOM
        if: always()
        run: |
          if [ -f ci-artifacts/flask-image.tar ]; then
            docker run --rm \
              -v "${PWD}/ci-artifacts:/scan" \
              aquasec/trivy:0.76.1 image \
              --input /scan/flask-image.tar \
              --format cyclonedx \
              --output /scan/sbom.cdx.json
          fi

      - name: Upload scan and SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-${{ github.run_id }}
          path: |
            ci-artifacts/trivy-vulnerabilities.json
            ci-artifacts/sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stage verified image for publishing (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-image-${{ github.sha }}
          path: ci-artifacts/flask-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Collect Docker diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env.ci ps -a || true
          docker compose --env-file .env.ci logs --no-color --tail=60 db app nginx || true

      - name: Cleanup temporary containers
        if: always()
        run: docker compose --env-file .env.ci down --remove-orphans || true

  publish:
    needs: build-test-scan-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download exact verified image
        uses: actions/download-artifact@v4
        with:
          name: verified-image-${{ github.sha }}
          path: ci-artifacts

      - name: Load verified Docker archive
        run: docker load -i ci-artifacts/flask-image.tar

      - name: Publish SAME image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-flask-app:${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag flask-nginx-postgres-lab-app:v6 "$image"
          docker push "$image"
          echo "Published: $image" >> "$GITHUB_STEP_SUMMARY"
