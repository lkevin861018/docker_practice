global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: flask
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8000']

  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: http-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'http://nginx:80/healthz'
          - 'http://pgadmin:80/login'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # cAdvisor is opt-in: on Windows Docker Desktop, host mounts may not expose
  # accurate Linux container CPU/RAM/network metrics.
  # To enable on a Linux Docker host, uncomment and restart Prometheus:
  # - job_name: cadvisor
  #   static_configs:
  #     - targets: ['cadvisor:8080']
