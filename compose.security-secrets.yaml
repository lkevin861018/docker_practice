# Optional hardening: mount the Flask DB password as a Compose file secret.
# Invoke with: docker compose -f compose.yaml -f compose.security-secrets.yaml up -d --no-deps --force-recreate app
# Before using, create secrets/app_db_password.txt containing the SAME password as APP_DB_PASSWORD in .env.
services:
  app:
    environment:
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/app_db_password
    secrets:
      - app_db_password

secrets:
  app_db_password:
    file: ./secrets/app_db_password.txt
